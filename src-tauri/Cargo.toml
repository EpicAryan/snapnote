[package]
name = "snapnote"
version = "0.1.0"
description = "Label, file, and find your Windows screenshots"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "snapnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
snapnote-core = { path = "core" }
tauri = { version = "2.11", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
trash = "5"

[target.'cfg(windows)'.dependencies]
known-folders = "1.4"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["core"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
