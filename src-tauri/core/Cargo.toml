[package]
name = "snapnote-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
blake3 = "1"
image = "0.25"
notify = "8"

[dev-dependencies]
tempfile = "3"
